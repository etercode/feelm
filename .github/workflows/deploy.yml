name: Deploy

# Every push to main goes live. Also runnable by hand from the Actions tab,
# which is the way to redeploy without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while a deploy is running waits for it rather than racing it
# onto the same server directory.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Only to get deploy/remote.sh; the server pulls its own code.
      - uses: actions/checkout@v5

      - name: Load the SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: without it StrictHostKeyChecking would have to be
          # turned off, which trades away the check that we are talking to the
          # right server.
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Written to a file first, then run — not piped into `bash -s`.
      #
      # Piped, the script arrives on stdin, and so does everything after the
      # first command that reads stdin. `docker compose exec` does, even with
      # -T: it swallowed the rest of the script from the database-wait loop
      # onward, so the migrations, the cache clear and the health check never
      # ran. Bash reached EOF and exited 0, and a deploy that left the site
      # returning 500 on every request was reported as a success.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cat > /tmp/feelm-deploy.sh && bash /tmp/feelm-deploy.sh' < deploy/remote.sh
