# Fixes the Compose project name. Without it the name comes from the
# directory, so renaming the checkout would silently orphan the database
# volume and start again on an empty one.
name: feelm

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: feelm_php
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: feelm_nginx
    depends_on:
      - php
    restart: unless-stopped

  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: feelm_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feelm}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      # A stable data path inside the volume, across image versions.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    # Postgres ships with defaults chosen to start on anything, and against a
    # catalogue this size they cost more than every query in the application
    # put together. These are modest enough for a laptop; compose.prod.yaml
    # raises them to suit the server.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      # The default of 4 describes a spinning disk seeking. Nothing this runs
      # on has one.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-feelm}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  database_data:
