doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # The full-text column on works is a Postgres tsvector. Mapping it to a
        # string keeps schema comparisons quiet about a column no entity owns.
        mapping_types:
            tsvector: string

        # Tables owned entirely by migrations: no entity class, written with
        # raw DBAL because they hold millions of rows that entity hydration
        # would make far slower, and carrying partial indexes DBAL cannot
        # describe. Hiding them from schema comparison keeps
        # `doctrine:schema:validate` meaningful.
        #
        # This list is not cosmetic. Without it `doctrine:migrations:diff`
        # reads them as strays and writes DROP TABLE for each one, directly
        # above whatever you actually asked it to generate — which is how a
        # routine "add two tables" migration came within one command of taking
        # 14 million tag and related rows with it. Anything new that migrations
        # own and entities do not has to be added here on the day it is created.
        #
        # schema_filter matches table names only, which is why the partial
        # indexes on entity-owned tables cannot be hidden the same way. Those
        # are covered by the note below.
        schema_filter: '~^(?!(tmdb_(movie|series)_ids|work_tag|work_related|search_terms)$).*~'

        # KNOWN DRIFT: `doctrine:schema:validate` reports a DROP INDEX for every
        # partial index in the schema —
        #
        #     idx_work_search_popular   idx_work_details_unsynced
        #     idx_work_notable          idx_work_type_popularity
        #     idx_work_poster_todo      idx_work_backdrop_todo
        #     idx_work_next_episode     idx_feedback_image_purge
        #
        # None of it is drift. Each has a WHERE clause, and #[ORM\Index] has no
        # way to say WHERE, so the entity cannot describe what the migration
        # built. schema_filter cannot help either: it matches table names, and
        # these sit on tables entities do own.
        #
        # The consequence to remember: a generated migration will always contain
        # these drops, mixed in with whatever you asked for. Read every diff.
        #
        # idx_work_search_popular is the sharpest case —
        #
        # It is not drift. The index is created by Version20260803120000 and is
        # load-bearing for search — see WorkSearch::pooled(). It cannot be
        # declared on the entity because it indexes search_vector, a generated
        # column no entity maps, and Doctrine refuses an index on a column it
        # does not know. Mapping the column instead would pull a tsvector into
        # every hydration, which is worse than this note.
        #
        # So: mapping errors are real, and exactly one schema difference is
        # expected. A second one is not.
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
