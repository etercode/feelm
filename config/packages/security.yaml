security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # json_login handles POST /api/login (see security.html#json-login).
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: api_login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: App\Security\LoginFailureHandler

        # All other /api routes use a self-managed access token
        # (see security/access_token.html).
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            access_token:
                token_handler: App\Security\AccessTokenHandler

    # https://symfony.com/doc/current/security.html#securing-url-patterns-access-control
    access_control:
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/items, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/search, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/upcoming, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/users, methods: [GET], roles: PUBLIC_ACCESS }
        # Crawl progress: counts and titles already public through /api/items.
        - { path: ^/api/crawl, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
