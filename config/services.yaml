# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # `default::` resolves to null, which a string-typed constructor rejects.
    # These give the env fallbacks an actual empty string to fall back to.
    env_blank: ''
    contabo_region_default: 'eu2'
    # Requests per ten seconds. 40 was TMDB's published ceiling until they
    # retired it in 2019 for a much higher per-second allowance; 300 is 30/s,
    # comfortably inside what they serve today and enough that the pace is set
    # by how many requests are in flight rather than by this number.
    tmdb_rate_default: 300

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'
            - '../src/Dto/'

    App\EventSubscriber\CorsSubscriber:
        arguments:
            $allowedOrigins: '%env(default::CORS_ALLOWED_ORIGINS)%'
            $kernelEnvironment: '%kernel.environment%'

    App\Command\CatalogSeedCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\CatalogCrawlCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\CatalogCrawlSeriesCommand:
        arguments:
            # Optional on purpose: the service only exists under APP_ENV=dev.
            # See the constructor for why a long crawl has to empty it.
            $debugQueries: '@?doctrine.debug_data_holder'

    App\Command\CatalogRefreshSeriesCommand:
        arguments:
            $debugQueries: '@?doctrine.debug_data_holder'

    App\Service\Tmdb\TmdbClient:
        arguments:
            $readAccessToken: '%env(default::TMDB_API_READ_ACCESS_TOKEN)%'
            $apiKey: '%env(default::TMDB_API_KEY)%'
            $requestsPerWindow: '%env(int:default:tmdb_rate_default:TMDB_REQUESTS_PER_10S)%'

    App\Service\Tmdb\TmdbMediaStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Tmdb\TmdbDiscoverQueue:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\PublicUrlGenerator:
        arguments:
            $publicBaseUrl: '%env(PUBLIC_BASE_URL)%'

    # The whole service account JSON, not a path: the key has to reach the
    # container without being a file somebody can forget to mount. Blank by
    # default so a checkout with no Firebase project still boots — FcmSender
    # reports itself unconfigured and every push is a no-op.
    App\Service\Notify\FcmSender:
        arguments:
            $serviceAccountJson: '%env(default:env_blank:FCM_SERVICE_ACCOUNT)%'

    # Empty defaults so a checkout without a bucket still boots — ObjectStorage
    # reports itself unconfigured and the site serves TMDB's URLs as before.
    App\Service\Media\ObjectStorage:
        arguments:
            $key: '%env(default:env_blank:CONTABO_S3_KEY)%'
            $secret: '%env(default:env_blank:CONTABO_S3_SECRET)%'
            $bucket: '%env(default:env_blank:CONTABO_S3_BUCKET)%'
            $privateBucket: '%env(default:env_blank:CONTABO_S3_BACKUP_BUCKET)%'
            $region: '%env(default:contabo_region_default:CONTABO_S3_REGION)%'
            $tenant: '%env(default:env_blank:CONTABO_S3_TENANT)%'
            $publicBaseUrl: '%env(default:env_blank:CONTABO_S3_PUBLIC_URL)%'
